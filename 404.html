<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Страница не найдена — Личный кабинет</title>
  <style>
    :root { --paper: #f6f5f0; --ink: #1b1c18; --muted: #5d5f55; --lime: #e4f45a; --on-lime: #20230a; color-scheme: light dark; }
    @media (prefers-color-scheme: dark) { :root { --paper: #171815; --ink: #f1f0ea; --muted: #a6a89c; } }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; background: var(--paper); color: var(--ink); font: 400 18px/1.5 Manrope, system-ui, -apple-system, "Segoe UI", sans-serif; }
    main { width: 100%; max-width: 640px; }
    h1 { margin: 0 0 12px; font-size: clamp(36px, 8vw, 64px); line-height: 1.05; font-weight: 300; letter-spacing: -0.03em; }
    p { margin: 0 0 24px; color: var(--muted); }
    .btn { display: inline-flex; align-items: center; min-height: 52px; padding: 0 24px; background: var(--lime); color: var(--on-lime); border: 1px solid var(--on-lime); border-radius: 6px; font-weight: 600; text-decoration: none; }
    .btn:hover { background: var(--on-lime); color: var(--lime); }
    ul { display: flex; flex-wrap: wrap; gap: 4px 20px; margin: 28px 0 0; padding: 0; list-style: none; }
    li a { display: inline-flex; align-items: center; min-height: 44px; color: var(--ink); font-weight: 600; text-underline-offset: 0.3em; }
    a:focus-visible { outline: 3px solid var(--ink); outline-offset: 3px; }
  </style>
</head>
<body>
<main>
  <h1>Такой страницы нет</h1>
  <p>Возможно, ссылка устарела или в адресе опечатка. Вернитесь на главную или выберите страницу.</p>
  <a class="btn" id="home" href="/">На главную</a>
  <ul id="pages">
    <li><a href="prototype.html">Прототип</a></li>
    <li><a href="rollout.html">Внедрение</a></li>
    <li><a href="apply.html">Оставить заявку</a></li>
  </ul>
</main>
<script>
  /* Эта страница открывается по любому неверному адресу, поэтому ссылки считаем от корня сайта:
     на github.io это /название-репозитория/, на своём домене просто / */
  (function () {
    var base = '/';
    if (/\.github\.io$/.test(location.hostname)) base = '/' + (location.pathname.split('/')[1] || '') + '/';
    document.getElementById('home').setAttribute('href', base);
    [].forEach.call(document.querySelectorAll('#pages a'), function (a) { a.setAttribute('href', base + a.getAttribute('href')); });
  })();
</script>
</body>
</html>
